# mypy configuration for scripts/check_samples.py. The sample controllers are mostly
# unannotated and import third-party packages that are not installed; only errors that
# involve the Webots API are of interest, so inference noise from untyped code is muted:
# variables may change type, and attributes whose type mypy cannot infer are skipped.
[mypy]
check_untyped_defs = True
ignore_missing_imports = True
allow_redefinition_new = True
local_partial_types = True
disable_error_code = var-annotated, annotation-unchecked, has-type
