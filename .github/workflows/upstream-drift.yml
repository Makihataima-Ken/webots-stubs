name: Upstream drift

# Compares the stubs with the development branch of Webots every week, so that API
# changes are noticed before they ship in a release.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Compare the stubs with Webots master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Fetch Webots master
        run: uv run python scripts/fetch_upstream.py --tag master
      - name: Compare
        id: compare
        run: |
          status=0
          {
            echo '$ scripts/run_stubtest.py --tag master'
            uv run python scripts/run_stubtest.py --tag master -- --concise || status=1
            echo
            echo '$ scripts/check_api_coverage.py --tag master'
            uv run python scripts/check_api_coverage.py --tag master || status=1
          } > drift.txt 2>&1
          cat drift.txt
          echo "drift=${status}" >> "$GITHUB_OUTPUT"
      - name: Report the drift in an issue
        if: steps.compare.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Webots master differs from the stubs
        run: |
          {
            echo "The weekly comparison with the \`master\` branch of Webots found differences"
            echo "([workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
            echo "They may need stub changes for the next Webots release."
            echo
            echo '```'
            head -c 60000 drift.txt
            echo '```'
          } > body.md
          existing="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number')"
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --body-file body.md
          else
            gh issue create --title "${TITLE}" --body-file body.md
          fi
