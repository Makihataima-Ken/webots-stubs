name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # the Release workflow runs the full CI before publishing

permissions:
  contents: read

concurrency:
  # In a called workflow, github.workflow is the name of the caller: a run called by the
  # Release workflow gets its own group and is never cancelled by a direct CI run (nor
  # deadlocks with a concurrency group of the caller).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    name: Type check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: mypy
        run: uv run mypy --python-version ${{ matrix.python-version }} src tests examples
      - name: pyright
        run: uv run pyright --pythonversion ${{ matrix.python-version }}

  scripts:
    name: Type check the maintenance scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mypy scripts

  upstream:
    name: Upstream checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: .upstream
          key: upstream-${{ hashFiles('pyproject.toml', 'scripts/fetch_upstream.py') }}
      - name: Fetch the Webots sources
        run: uv run python scripts/fetch_upstream.py
      - name: stubtest (upstream sources, native library stubbed out)
        run: uv run python scripts/run_stubtest.py
      - name: API coverage and docstrings
        if: runner.os == 'Linux'
        run: uv run python scripts/check_api_coverage.py
      - name: Sample controllers
        if: runner.os == 'Linux'
        run: uv run python scripts/check_samples.py

  stubtest-webots:
    name: stubtest against a Webots installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Read the targeted Webots release
        id: webots
        run: echo "tag=$(uv run python -c 'import sys; sys.path.insert(0, "scripts"); import _upstream; print(_upstream.webots_tag())')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ runner.temp }}/webots
          key: webots-${{ steps.webots.outputs.tag }}-linux
      - name: Download Webots ${{ steps.webots.outputs.tag }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/cyberbotics/webots/releases/download/${TAG}/webots-${TAG}-x86-64.tar.bz2" \
            | tar xj -C "$RUNNER_TEMP"
        env:
          TAG: ${{ steps.webots.outputs.tag }}
      - name: stubtest
        run: uv run python scripts/run_stubtest.py --webots-home "$RUNNER_TEMP/webots"

  package:
    name: Build and test the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Check the wheel contents
        run: |
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -q "controller-stubs/__init__.pyi"
          unzip -l dist/*.whl | grep -q "vehicle-stubs/__init__.pyi"
      - name: Type-check the examples against the installed wheel
        # Outside the repository, so that only the installed stubs can be found. The type
        # checkers are pinned to the versions of uv.lock, like in the other jobs.
        run: |
          uv export --locked --only-group dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/dev-requirements.txt"
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl -r "$RUNNER_TEMP/dev-requirements.txt"
          mkdir "$RUNNER_TEMP/check"
          cp -r examples tests/typecheck "$RUNNER_TEMP/check/"
          cd "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/venv/bin/mypy" --strict --enable-error-code deprecated .
          "$RUNNER_TEMP/venv/bin/pyright" --pythonpath "$RUNNER_TEMP/venv/bin/python" .
